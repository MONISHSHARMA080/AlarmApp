<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" width="420" height="360">
  <defs>
    <linearGradient id="amberSweater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC42E"/>
      <stop offset="100%" stop-color="#ED9A00"/>
    </linearGradient>
    <linearGradient id="amberArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFCA42"/>
      <stop offset="100%" stop-color="#F2A400"/>
    </linearGradient>
    <linearGradient id="skinLoud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD6BA"/>
      <stop offset="100%" stop-color="#F4B48C"/>
    </linearGradient>
  </defs>

  <!-- Energetic comic sound waves on both sides of head -->
  <g fill="none" stroke-linecap="round">
    <path d="M108,118 A66,66 0 0,0 108,194" stroke="#2355D6" stroke-width="6.5"/>
    <path d="M84,102 A90,90 0 0,0 84,210" stroke="#FF6D4D" stroke-width="6.5"/>
    <path d="M62,122 A74,74 0 0,0 62,190" stroke="#6A9BFF" stroke-width="5"/>

    <path d="M312,118 A66,66 0 0,1 312,194" stroke="#2355D6" stroke-width="6.5"/>
    <path d="M336,102 A90,90 0 0,1 336,210" stroke="#FF6D4D" stroke-width="6.5"/>
    <path d="M358,122 A74,74 0 0,1 358,190" stroke="#6A9BFF" stroke-width="5"/>
  </g>

  <!-- Seamless torso + bent arms silhouette (no awkward round elbow nubs!) -->
  <path d="M86,360 L82,298 C80,256 96,210 132,174 L162,194 C138,218 130,244 134,268 C154,250 180,244 210,244 C240,244 266,250 286,268 C290,244 282,218 258,194 L288,174 C324,210 340,256 338,298 L334,360 Z" fill="url(#amberSweater)"/>

  <!-- Subtle arm fold crease shadows for depth -->
  <path d="M134,268 Q128,302 142,324" fill="none" stroke="#D48400" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <path d="M286,268 Q292,302 278,324" fill="none" stroke="#D48400" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>

  <!-- Collar -->
  <path d="M178,246 Q210,274 242,246" fill="none" stroke="#D48400" stroke-width="6" stroke-linecap="round"/>

  <!-- Neck -->
  <rect x="195" y="218" width="30" height="34" rx="12" fill="#E49F78"/>

  <!-- Head -->
  <circle cx="210" cy="166" r="64" fill="url(#skinLoud)"/>

  <!-- Tousled dark hair -->
  <path d="M144,162 C142,108 176,84 214,86 C256,88 280,116 276,162 C260,136 240,128 212,128 C182,128 162,138 144,162 Z" fill="#171E2E"/>
  <path d="M192,90 C186,68 214,64 222,88 C236,72 254,82 242,98" fill="#171E2E"/>
  <path d="M168,112 Q204,96 240,112" fill="none" stroke="#2E3B59" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Sculpted hands pressed over ears (clearly read as hands with palms + fingers!) -->
  <!-- Left hand -->
  <g>
    <path d="M144,196 C128,194 122,174 126,150 C128,140 137,138 141,146 L144,139 C148,134 156,138 156,148 L158,180 C158,192 152,197 144,196 Z" fill="#FFD6BA" stroke="#E09B74" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M140,148 L142,166" stroke="#E09B74" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Right hand -->
  <g>
    <path d="M276,196 C292,194 298,174 294,150 C292,140 283,138 279,146 L276,139 C272,134 264,138 264,148 L262,180 C262,192 268,197 276,196 Z" fill="#FFD6BA" stroke="#E09B74" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M280,148 L278,166" stroke="#E09B74" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Rosy cheeks -->
  <ellipse cx="174" cy="186" rx="10" ry="6" fill="#FF7F6B" opacity="0.45"/>
  <ellipse cx="246" cy="186" rx="10" ry="6" fill="#FF7F6B" opacity="0.45"/>

  <!-- Startled awake eyes + furrowed brows -->
  <circle cx="188" cy="168" r="8.5" fill="#171E2E"/>
  <circle cx="191" cy="165" r="2.8" fill="#FFFFFF"/>
  <circle cx="232" cy="168" r="8.5" fill="#171E2E"/>
  <circle cx="235" cy="165" r="2.8" fill="#FFFFFF"/>

  <path d="M174,148 L198,155" stroke="#171E2E" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M246,148 L222,155" stroke="#171E2E" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M209,172 Q212,179 208,182" fill="none" stroke="#D9936E" stroke-width="3" stroke-linecap="round"/>

  <!-- Clenched "WHOA THAT'S LOUD!" mouth -->
  <rect x="193" y="194" width="34" height="16" rx="8" fill="#FFFFFF" stroke="#171E2E" stroke-width="3.5"/>
  <line x1="204" y1="194" x2="204" y2="210" stroke="#171E2E" stroke-width="2"/>
  <line x1="216" y1="194" x2="216" y2="210" stroke="#171E2E" stroke-width="2"/>
</svg>
